# Gera os instaladores do Bingo Digital para Windows, macOS (Apple Silicon e Intel) e Linux,
# de graça, no GitHub Actions, e PUBLICA o Release (com latest.json e hashes.txt) quando os 4 terminam bem.
# O site (bingo:desktop-versoes: no deploy, de hora em hora e no botão do Admin › Versões) puxa sozinho
# a versão nova, os instaladores da página inicial e as impressões digitais oficiais.
#
# Como usar: Settings → Secrets and variables → Actions → Variables:
#   BINGO_API_URL       = https://seu-dominio (sem /api no fim)
#   BINGO_CHAVE_PUBLICA = saída de `php artisan bingo:desktop-chaves` no servidor de produção
#   BINGO_FIXAR_CERTIFICADO = letsencrypt   SÓ se o app falar direto com um certificado Let's Encrypt.
#                             Atrás do Cloudflare (bingodigital.ivocompany.com), NÃO crie esta variável:
#                             o certificado é do Cloudflare (Google Trust Services etc.) e o app não conectaria.
# e em Secrets:
#   TAURI_SIGNING_PRIVATE_KEY = conteúdo de ~/.tauri/bingo-digital.key (assina as atualizações automáticas)
# Lançar versão: bash scripts/nova-versao.sh 1.2.0   (troca a versão, faz o commit, a tag e o push)
# Se uma plataforma falhar, o release fica como RASCUNHO e o site não recebe nada (corrija e rode de novo).
#
# Sem certificado pago: macOS usa assinatura local ("-") e Windows sai sem assinatura
# (aparecem avisos na 1ª instalação; o passo a passo está no README).
name: release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  instaladores:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest      # Macs Apple Silicon (M1 em diante)
            args: --target aarch64-apple-darwin
          - platform: macos-latest      # Macs Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04      # Linux (.deb, .rpm e AppImage)
            args: ''
          - platform: windows-latest    # Windows (instalador .exe e .msi)
            args: ''
    runs-on: ${{ matrix.platform }}
    env:
      BINGO_API_URL: ${{ vars.BINGO_API_URL }}
      BINGO_CHAVE_PUBLICA: ${{ vars.BINGO_CHAVE_PUBLICA }}
      BINGO_FIXAR_CERTIFICADO: ${{ vars.BINGO_FIXAR_CERTIFICADO }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4

      - name: tag igual à versão do app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "v$VERSAO" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A tag é $GITHUB_REF_NAME mas o package.json está em $VERSAO. Use scripts/nova-versao.sh."
            exit 1
          fi

      - name: conferir configuração de produção
        shell: bash
        run: |
          if [ -z "$BINGO_API_URL" ] || [ -z "$BINGO_CHAVE_PUBLICA" ] || [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Configure BINGO_API_URL e BINGO_CHAVE_PUBLICA (Variables) e TAURI_SIGNING_PRIVATE_KEY (Secrets)."
            exit 1
          fi

      - name: dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: testes do núcleo (regras do jogo e licença)
        working-directory: src-tauri
        run: cargo test --lib

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Bingo Digital v__VERSION__'
          releaseBody: 'Instaladores do Bingo Digital. Veja no README como instalar sem susto (avisos de segurança do Windows e do macOS).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Impressão digital oficial do executável (o app manda no cabeçalho X-App-Hash).
      # Vai para o hashes.txt do release (o site lê sozinho); também aparece no resumo do run.
      - name: impressão digital oficial
        shell: bash
        run: |
          VERSAO=$(node -p "require('./package.json').version")
          if [ "$RUNNER_OS" = "macOS" ]; then
            EXE=$(find src-tauri/target -path '*/bundle/macos/*.app/Contents/MacOS/*' -type f | head -1)
          elif [ "$RUNNER_OS" = "Windows" ]; then
            EXE=$(find src-tauri/target -path '*/release/*.exe' -name 'bingo-desktop.exe' | head -1)
          else
            EXE=$(find src-tauri/target -path '*/release/bingo-desktop' -type f | head -1)
          fi
          HASH=$( (sha256sum "$EXE" 2>/dev/null || shasum -a 256 "$EXE") | cut -d' ' -f1 )
          echo "### Impressão digital (${{ matrix.platform }} ${{ matrix.args }})" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${VERSAO}:${HASH}\`" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p hash && echo "${VERSAO}:${HASH}" > hash/hash.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ strategy.job-index }}
          path: hash/hash.txt

  # Só quando os 4 sistemas deram certo: junta as impressões digitais no hashes.txt e publica o release.
  publicar:
    needs: instaladores
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
          path: hashes
      - name: hashes.txt e publicar o release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          cat hashes/*/hash.txt | sort -u > hashes.txt
          cat hashes.txt
          gh release upload "$TAG" hashes.txt --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          echo "### Release $TAG publicado" >> "$GITHUB_STEP_SUMMARY"
          echo "O site cadastra e publica a versão sozinho no próximo deploy, em até 1 hora, ou já no botão Admin › Versões › Buscar versão nova no GitHub." >> "$GITHUB_STEP_SUMMARY"
